<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>UML Диаграммы (Draw.io Style)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 40px;
            padding: 20px;
            width: 850px;
        }
        h2 {
            font-size: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-top: 0;
            color: #232323;
        }
        /* Стили для SVG (фигуры) */
        rect, circle, polygon {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 1.5;
        }
        .blue-fill { fill: #dae8fc; stroke: #6c8ebf; }
        .green-fill { fill: #d5e8d4; stroke: #82b366; }
        .orange-fill { fill: #ffe6cc; stroke: #d79b00; }
        .yellow-fill { fill: #fff2cc; stroke: #d6b656; }
        .system-border { fill: none; stroke: #999; stroke-dasharray: 5,5; stroke-width: 2; }
        .actor-head { fill: none; stroke: #000; stroke-width: 1.5; }
        
        text {
            font-family: Arial, sans-serif;
            font-size: 13px;
            fill: #000;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .lifeline { stroke: #000; stroke-width: 1.5; stroke-dasharray: 4,4; }
        line { stroke: #000; stroke-width: 1.5; }
        polygon.arrow-head { fill: #000; stroke: #000; }
    </style>
</head>
<body>

    <!-- 1. КОНТЕКСТНАЯ -->
    <div class="container">
        <h2>1. Контекстная диаграмма (Context)</h2>
        <svg width="800" height="300">
            <!-- Центральная система -->
            <rect x="300" y="100" width="200" height="80" rx="5" class="blue-fill"/>
            <text x="400" y="135" font-weight="bold">1v9.gg</text>
            <text x="400" y="155">(Маркетплейс)</text>
            
            <!-- Акторы -->
            <rect x="50" y="30" width="100" height="40" class="yellow-fill"/>
            <text x="100" y="50">Покупатель</text>
            <line x1="100" y1="70" x2="300" y2="120" />

            <rect x="650" y="30" width="100" height="40" class="yellow-fill"/>
            <text x="700" y="50">Бустер</text>
            <line x1="700" y1="70" x2="500" y2="120" />

            <rect x="50" y="210" width="100" height="40" class="yellow-fill"/>
            <text x="100" y="230">Продавец</text>
            <line x1="100" y1="210" x2="300" y2="160" />

            <rect x="650" y="210" width="100" height="40" class="yellow-fill"/>
            <text x="700" y="230">Админ</text>
            <line x1="700" y1="210" x2="500" y2="160" />
        </svg>
    </div>

    <!-- 2. КОНТЕЙНЕРЫ -->
    <div class="container">
        <h2>2. Диаграмма контейнеров (Container)</h2>
        <svg width="800" height="320">
            <!-- Пользователь -->
            <rect x="300" y="10" width="140" height="40" class="yellow-fill"/>
            <text x="370" y="30">Пользователь</text>
            <line x1="370" y1="50" x2="370" y2="80" marker-end="url(#arrow)"/>
            <text x="390" y="65" font-size="11" text-anchor="start">HTTPS</text>

            <!-- Граница системы -->
            <rect x="150" y="80" width="440" height="200" class="system-border"/>
            <text x="370" y="95" font-size="11" text-anchor="middle" fill="#666">Граница системы 1v9.gg</text>

            <!-- Контейнеры -->
            <rect x="270" y="110" width="200" height="40" class="blue-fill"/>
            <text x="370" y="130">Frontend (React)</text>
            
            <line x1="370" y1="150" x2="370" y2="170" marker-end="url(#arrow)"/>
            <text x="390" y="160" font-size="11" text-anchor="start">REST</text>

            <rect x="270" y="170" width="200" height="40" class="blue-fill"/>
            <text x="370" y="190">Backend (NestJS)</text>

            <line x1="370" y1="210" x2="370" y2="230" marker-end="url(#arrow)"/>
            
            <rect x="180" y="230" width="130" height="40" class="green-fill"/>
            <text x="245" y="250">PostgreSQL</text>

            <rect x="430" y="230" width="130" height="40" class="orange-fill"/>
            <text x="495" y="250">Stripe/Crypto</text>
            
            <!-- Линия от бэкенда к БД и платежке -->
            <line x1="270" y1="190" x2="245" y2="230" />
            <line x1="470" y1="190" x2="495" y2="230" />
        </svg>
    </div>

    <!-- 3. ПОСЛЕДОВАТЕЛЬНОСТЬ -->
    <div class="container">
        <h2>3. Диаграмма последовательностей (Sequence)</h2>
        <svg width="800" height="350">
            <!-- Участники -->
            <rect x="80" y="10" width="120" height="40" class="blue-fill"/>
            <text x="140" y="30">Покупатель</text>
            
            <rect x="340" y="10" width="120" height="40" class="blue-fill"/>
            <text x="400" y="30">Платформа</text>
            
            <rect x="600" y="10" width="120" height="40" class="blue-fill"/>
            <text x="660" y="30">Бустер</text>

            <!-- Линии жизни -->
            <line x1="140" y1="50" x2="140" y2="330" class="lifeline"/>
            <line x1="400" y1="50" x2="400" y2="330" class="lifeline"/>
            <line x1="660" y1="50" x2="660" y2="330" class="lifeline"/>

            <!-- Сообщения -->
            <line x1="140" y1="80" x2="395" y2="80" marker-end="url(#arrow)"/>
            <text x="265" y="70" font-size="12">1. Оплатить заказ</text>

            <line x1="400" y1="130" x2="655" y2="130" marker-end="url(#arrow)"/>
            <text x="525" y="120" font-size="12">2. Передать заказ</text>

            <!-- Активация (полоска на линии бустера) -->
            <rect x="652" y="130" width="16" height="100" style="fill:#fff; stroke:#000;"/>
            <line x1="660" y1="160" x2="660" y2="200" marker-end="url(#arrow)"/>
            <text x="680" y="180" font-size="12" text-anchor="start">3. Выполнить работу</text>

            <line x1="660" y1="230" x2="405" y2="230" marker-end="url(#arrow)"/>
            <text x="525" y="220" font-size="12">4. Заказ готов</text>

            <line x1="400" y1="280" x2="145" y2="280" marker-end="url(#arrow)"/>
            <text x="265" y="270" font-size="12">5. Подтвердить получение</text>
        </svg>
    </div>

    <!-- 4. РАЗВЕРТЫВАНИЕ -->
    <div class="container">
        <h2>4. Диаграмма развертывания (Deployment)</h2>
        <svg width="800" height="300">
            <!-- Браузер -->
            <rect x="50" y="120" width="120" height="50" class="yellow-fill"/>
            <text x="110" y="145">Браузер</text>

            <line x1="170" y1="145" x2="280" y2="145" marker-end="url(#arrow)"/>
            <text x="225" y="135" font-size="11">HTTPS/WSS</text>

            <!-- Сервер (в виде 3D куба) -->
            <polygon points="350,60 500,60 550,100 400,100" class="blue-fill" />
            <polygon points="400,100 550,100 550,200 400,200" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
            <polygon points="350,60 400,100 400,200 350,160" class="blue-fill" />
            <!-- Текст на кубе -->
            <text x="450" y="85" font-size="12">Сервер (AWS)</text>
            
            <rect x="420" y="120" width="100" height="30" style="fill:#fff; stroke:#000;"/>
            <text x="470" y="135" font-size="12">NestJS</text>
            
            <rect x="420" y="160" width="100" height="30" style="fill:#fff; stroke:#000;"/>
            <text x="470" y="175" font-size="12">PostgreSQL</text>
            
            <line x1="470" y1="150" x2="470" y2="160" marker-end="url(#arrow)"/>

            <!-- CDN -->
            <rect x="650" y="100" width="100" height="80" rx="10" class="green-fill"/>
            <text x="700" y="130">CDN</text>
            <text x="700" y="150" font-size="11">(React)</text>
            <line x1="500" y1="110" x2="650" y2="130" />
        </svg>
    </div>

    <!-- 5. USE CASE -->
    <div class="container">
        <h2>5. Диаграмма вариантов использования (Use Case)</h2>
        <svg width="800" height="380">
            <!-- Граница системы -->
            <rect x="220" y="20" width="400" height="340" stroke="#666" fill="none" stroke-width="2" rx="5"/>
            <text x="420" y="40" fill="#666" font-size="14">Система 1v9.gg</text>

            <!-- Овалы (функции) -->
            <!-- Левая колонка -->
            <ellipse cx="320" cy="90" rx="70" ry="25" class="blue-fill"/>
            <text x="320" y="90">Купить бустинг</text>

            <ellipse cx="320" cy="170" rx="70" ry="25" class="blue-fill"/>
            <text x="320" y="170">Оплатить крипту</text>

            <ellipse cx="320" cy="250" rx="70" ry="25" class="blue-fill"/>
            <text x="320" y="250">Открыть спор</text>

            <!-- Правая колонка -->
            <ellipse cx="520" cy="90" rx="70" ry="25" class="green-fill"/>
            <text x="520" y="90">Выполнить заказ</text>

            <ellipse cx="520" cy="170" rx="70" ry="25" class="green-fill"/>
            <text x="520" y="170">Вывести средства</text>

            <ellipse cx="520" cy="280" rx="70" ry="25" class="orange-fill"/>
            <text x="520" y="280">Решить спор</text>

            <!-- Актер 1 (Покупатель) -->
            <circle cx="80" cy="130" r="10" class="actor-head"/>
            <line x1="80" y1="140" x2="80" y2="170" />
            <line x1="60" y1="155" x2="100" y2="155" />
            <line x1="80" y1="170" x2="60" y2="190" />
            <line x1="80" y1="170" x2="100" y2="190" />
            <text x="80" y="210">Покупатель</text>
            
            <!-- Линии от Покупателя -->
            <line x1="100" y1="155" x2="250" y2="90" />
            <line x1="100" y1="160" x2="250" y2="170" />
            <line x1="90" y1="170" x2="250" y2="250" />

            <!-- Актер 2 (Бустер) -->
            <circle cx="80" cy="50" r="10" class="actor-head"/>
            <line x1="80" y1="60" x2="80" y2="90" />
            <line x1="60" y1="75" x2="100" y2="75" />
            <line x1="80" y1="90" x2="60" y2="110" />
            <line x1="80" y1="90" x2="100" y2="110" />
            <text x="80" y="130">Бустер</text>

            <!-- Линии от Бустера (пересекают границу) -->
            <line x1="100" y1="75" x2="450" y2="90" />
            <line x1="100" y1="85" x2="450" y2="170" />

            <!-- Актер 3 (Админ) -->
            <circle cx="80" cy="300" r="10" class="actor-head"/>
            <line x1="80" y1="310" x2="80" y2="340" />
            <line x1="60" y1="325" x2="100" y2="325" />
            <line x1="80" y1="340" x2="60" y2="360" />
            <line x1="80" y1="340" x2="100" y2="360" />
            <text x="80" y="380">Админ</text>

            <!-- Линия от Админа -->
            <line x1="100" y1="325" x2="450" y2="280" />
        </svg>
    </div>

    <!-- Маркер для стрелочек -->
    <svg style="display:none;">
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
            </marker>
        </defs>
    </svg>

</body>
</html>
